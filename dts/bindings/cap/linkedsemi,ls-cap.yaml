description: CAP controller for Linkedsemi

compatible: "linkedsemi,ls-cap"

include: [base.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true
    description: "Register address and size"
  clock-frequency:
    type: int
    required: true
    description: "Input clock frequency of the CAP module (unit: Hz)"
  prescaler:
    type: int
    required: true
    description: "Prescaler value for the CAP timer"
  channels:
    type: array
    required: true
    description: "CAP channels config"
  clocks:
    required: true
    description: "CAP module clock"