description: LS Independent Watchdog Timer

compatible: "linkedsemi,ls-watchdog"

include: [base.yaml, reset-device.yaml]

properties:
  reg:
    required: true
    description: "Register address and size"
  interrupts:
    required: true
    description: Independent Watchdog interrupt
  clock-frequency:
    type: int
    required: true
    description: "clock-frequency value for the Independent Watchdog timer"
  clocks:
    required: true
    description: "Independent Watchdog module clock"
