description: Synopsys DesignWare SPI node

compatible: "snps,designware-spi"

include: [spi-controller.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  aux-reg:
    type: boolean
    description: |
      This value is used for auxiliary register access. For
      other platform, this value should be default 0.

  fifo-depth:
    type: int
    description: |
      RX/TX FIFO depth. Corresponds to the SSI_TX_FIFO_DEPTH
      and SSI_RX_FIFO_DEPTH of the DesignWare Synchronous
      Serial Interface. Depth ranges from 2-256.

  serial-target:
    type: boolean
    description: |
      True if it is a Serial Target. False if it is a Serial
      Master. Corresponds to SSI_IS_MASTER of the Designware
      Synchronous Serial Interface.

  max-xfer-size:
    type: int
    description: |
      Maximum transfer size. Corresponds to SPI_MAX_XFER_SIZE
      of the DesignWare Synchronous Serial Interface. Only
      values of 16 and 32 are supported.
    enum:
      - 16
      - 32

  timing-calibration-disabled:
    type: boolean
    required: false
    description: |
      Disable SPI controller timing calibration capability.

  timing-calibration-auto-detect-content-disable:
    type: boolean
    required: false
    description: |
      Disable SPI controller timing calibration auto detect flash valid content capability.

  timing-calibration-start-offset:
    type: int
    required: false
    description: |
      The flash data offset for timing calibration.
    default: 0

  timing-calibration-clock-frequency:
    type: int
    required: false
    description: |
      low clock frequency for calibration.
    default: 10000000

  spi-ctrl-caps-mask:
    type: int
    required: false
    description: |
      SPI flash controller mode/protocol capability configuration.

      bit 0 : disable 1-1-1
      bit 1 : disable 1-1-1 (fast read)
      bit 8 : disable 1-1-2
      bit 9 : disable 1-2-2
      bit 10: disable 2-2-2
      bit 16: disable 1-1-4
      bit 17: disable 1-4-4
      bit 18: disable 4-4-4

