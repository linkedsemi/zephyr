description: linkedsemi CPU Mailbox

compatible: "linkedsemi,mbox"

include: [base.yaml, mailbox-controller.yaml]

properties:
  initiator:
    type: int
    required: true
  intr_mask:
    type: int
    description: |
      Interrupt mask register address
  intr_clr:
    type: int
    required: true
    description: |
      Interrupt clear register address
  peer_intr_set:
    type: int
    required: true
    description: |
      Peer pInterrupt set register address

mbox-cells:
  - channel
  - tx_fifo_width
  - tx_fifo_depth
  - rx_fifo_width
  - rx_fifo_depth
