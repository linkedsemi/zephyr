description: PWM controller for Linkedsemi 101x

compatible: "linkedsemi,ls-pwm"

include: [base.yaml, pwm-controller.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  reg:
    required: true

  pinctrl-0:
    required: true

  clock-frequency:
    type: int
    required: true

  prescaler:
    type: int
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true

  "#pwm-cells":
    const: 3

pwm-cells:
  - channel
  - period
  - flags