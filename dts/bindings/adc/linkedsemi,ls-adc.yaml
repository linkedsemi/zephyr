description: LINKEDSEMI LS ADC

compatible: "linkedsemi,ls-adc"

include: [base.yaml,pinctrl-device.yaml, reset-device.yaml,hwmon-controller.yaml]

properties:
  clock-source:
    type: int
    required: true
    description: "System clock source"

  conversion_mode:
    type: int
    required: true
    description: "Specifies ADC conversion mode"

  data_align:
    type: int
    required: true
    description: "Specifies ADC data alignment"

  continuous_conv_mode:
    type: int
    required: true
    description: "Specifies whether the conversion is performed in single mode (one conversion) or continuous mode for regular group"

  nbr_of_conversion:
    type: int
    required: true
    description: "Continuous capture item number for every capture start trigger in regular mode or injection mode"

  discontinuous_conv_mode:
    type: int
    required: true
    description: "Specifies whether the conversions sequence of regular group is performed in Complete-sequence/Discontinuous-sequence (main sequence subdivided in successive parts)."

  nbr_of_disc_conversion:
    type: int
    required: true
    description: "Specify the number of discontinuous transitions that occur in the main sequences of the regular group and the injection group. If the parameter 'DiscontinuousConvMode' is disabled, this parameter will be ignored."

  trig_type:
    type: int
    required: true
    description: "Selects the external event used to trigger the conversion start of regular group."

  adc_drive_type:
    type: int
    required: true
    description: " Select ADC Driving mode"

  adc_clk_div:
    type: int
    required: true
    description: "ADC division coefficient ranges from 1 to 0x1FFFF"

  clk_cfg:
    type: int
    required: true
    description: "ADC Clock Division"

  injected_offset:
    type: int
    required: true
    description: "Only valid in the injection mode"

  fif_ctrl1:
    type: int
    required: true
    description: "Only valid in the loop mode"