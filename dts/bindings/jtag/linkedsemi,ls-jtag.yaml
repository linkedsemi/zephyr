description: LINKEDSEMI LS JTAG

compatible: "linkedsemi,ls-jtag"

include: [base.yaml,pinctrl-device.yaml, reset-device.yaml]

properties:
  clock-source:
    type: int
    description: "System clock source"

  bus-frequency:
    type: int
    description: "jtag master bus frequency"

  tx-delay:
    type: int
    default: 0
    description: |
      TXD_CAP_DLY register value (0..31), delay = reg + 1 APB clock
      cycles. Tuned manually per board, no frequency auto-calculation.

  rx-delay:
    type: int
    default: 0
    description: |
      RXD_CAP_DLY register value (0..31), delay = reg + 1 APB clock
      cycles. Tuned manually per board, no frequency auto-calculation.

  tck-gpios:
    type: phandle-array
    description: "tck simulated by gpio"

  tms-gpios:
    type: phandle-array
    description: "tms simulated by gpio"

  tdi-gpios:
    type: phandle-array
    description: "tdi simulated by gpio"

  tdo-gpios:
    type: phandle-array
    description: "tdo simulated by gpio"

  trst-gpios:
    type: phandle-array
    description: "trst simulated by gpio"
