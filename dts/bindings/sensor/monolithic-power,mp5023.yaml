# MP5023 PMBus Sensor

compatible: "monolithic-power,mp5023"

include: [sensor-device.yaml, smbus-device.yaml]

properties:
  reg:
    required: true

  alert-gpios:
    type: phandle-array
    description: Alert pin
    # Optional

  smbus-max-frequency:
    type: int
    description: Maximum frequency of the SMBus interface
    default: 100000