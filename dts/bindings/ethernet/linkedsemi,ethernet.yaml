description: LINKEDSEMI Ethernet

compatible: "linkedsemi,ethernet"

include: [ethernet-controller.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  clock-frequency:
    type: int
    required: true
    description: |
      clock frequency in Hz

  tx-delay:
    type: int
    description: |
      mac internal tx clock delay

  rx-delay:
    type: int
    description: |
      mac internal rx clock delay

  mdio-handle:
    type: phandle
    description: |
      Specifies a reference to a node representing a MDIO device.
