description: linkedsemi Hwmon

compatible: "linkedsemi,hwmon"

include: [base.yaml, hwmon-controller.yaml]

properties:
  class:
    type: int
    required: true
  sensor-type:
    type: string
    required: false
    enum:
      - temp
      - psu
      - intrusion
      - peci_cputemp
    # NOTE: `sensor-type` is only a label (used for the hwmon `name` file).
    # It does NOT decide which <chan>_input files are created.
    # `peci_cputemp` is matched by IntelCPUSensorMain (name == "peci_cputemp"
    # filter, same string the upstream Linux xeon-pci-sensors driver emits).
  meas:
    type: string-array
    required: false
    description: >
      List of hwmon ABI files to expose for this node. Each entry is
      "<chan><n>_input" with an OPTIONAL ":<label>" suffix, e.g.
      "in1_input:vin1", "in3_input:vout1", "curr2_input:iout1",
      "power2_input:pout1", "temp1_input", "fan1_input",
      "intrusion1_input".

      At read time hwmon_i2c parses the filename part (before ':'): the prefix
      (in/curr/power/temp/fan/intrusion) selects the sensor_channel, and the
      number (minus 1) is passed as val2 (the rail/sub-channel selector the
      driver's channel_get expects).

      The OPTIONAL part after ':' becomes the content of a companion
      "<chan><n>_label" file (input->label). This lets dbus-sensors tell
      vin/vout, iin/iout, pin/pout apart (label heads such as vin1, vout1,
      iin1, iout1, pin, pout1, should pick from labelMatch in PSUSensorMain). 
      If ":<label>" is omitted no label file is
      created and dbus-sensors falls back to the generic "output" property.
  hwmon-ins:
    type: phandle-array
  hwmon-outs:
    type: phandle-array
