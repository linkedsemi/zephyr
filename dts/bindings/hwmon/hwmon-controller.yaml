# Common fields for hwmon controller

properties:
  "#hwmon-in-cells":
    const: 1
    type: int
    description: Number of items to expect in a hwmon input specifier
  "#hwmon-out-cells":
    const: 1
    type: int
    description: Number of items to expect in a hwmon output specifier

hwmon-in-cells:
  - channel

hwmon-out-cells:
  - channel