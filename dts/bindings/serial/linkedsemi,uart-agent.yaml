description: Linkedsemi uart agent
compatible: "linkedsemi,uart-agent"

include: [base.yaml]

properties:
  fifo_base:
    type: int
    required: true
    description: Virtual UART FIFO Base Addr

  mbox:
    type: phandle

  uart:
    type: phandles
    required: true
    description: |
      Phandles to the physical UART controllers. Every backend receives the
      data written by the host on the shared virtual UART FIFO, and the data
      received on all of them is merged into that same FIFO.
