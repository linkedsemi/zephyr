# linkedsemi,ls-host-vuart.yaml
description: LINKEDSEMI Host vUART

compatible: "linkedsemi,ls-host-vuart"

include: [uart-controller.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  port:
    type: int
    required: true
    description: "Base I/O port address for the host VUART"

  clock-source:
    type: int
    description: "System clock source"

  up-irq:
    type: array
    required: true
    description: "Upstream interrupt specification"
