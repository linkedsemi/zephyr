# linkedsemi,ls-host-vuart.yaml
description: LINKEDSEMI eSPI Host vUART

compatible: "linkedsemi,ls-host-vuart"

include: [base.yaml]

properties:
  port:
    type: int
    required: true
    description: "Base I/O port address for the host VUART"

  host_vuart_reg:
    type: int
    required: true
    description: "Host VUART register address"

  host_irq:
    type: int
    required: true
    description: "Host interrupt number for the VUART"

  level_irq:
    type: boolean
    required: false
    description: "Whether the interrupt is level-triggered (true) or edge-triggered (false)"

  target:
    type: phandle
    required: true
    description: "Phandle to the target virtual UART device"

  up-irq:
    type: array
    required: false
    description: "Upstream interrupt specification"
