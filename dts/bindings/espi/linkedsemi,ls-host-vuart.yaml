description: LINKEDSEMI Host VUART

compatible: "linkedsemi,ls-host-vuart"

include: [base.yaml, pinctrl-device.yaml, reset-device.yaml]

properties:
  port:
    type: int
    required: true
    description: "Base I/O port address for the host VUART"

  clock-source:
    type: int
    required: true
    description: |
      Clock source subsystem ID used for clock control configuration.
      This value is passed to the clock control subsystem to get the rate.
  
  current-speed:
    type: int
    description: Initial baud rate setting for UART
  
  up-irq:
    type: array
    required: true
    description: "Upstream interrupt specification"

  fifo_base:
    type: int
    required: true
    description: Virtual UART FIFO Base Addr

  espi_lpc:
    type: phandle
    required: true
    description: espi lpc device handle

  mbox:
    type: phandle