description: Linkedsemi I2C controller

compatible: "linkedsemi,ls-i2c"

include: [i2c-controller.yaml, pinctrl-device.yaml, reset-device.yaml, hwmon-controller.yaml]

properties:
    reg:
      required: true

    interrupts:
      required: true

    clock-frequency:
      type: int
      description: i2c clock frequency (Hz)
      required: true

    bus-frequency:
      type: int
      enum: [100000, 400000, 1000000]
      description: output clock frequency (Hz)

    scl-overhead-ns:
      type: int
      default: 398
      description: |
        Fixed per-cycle SCL period overhead in nanoseconds caused by bus
        pull-up RC charge/discharge time (board/wiring dependent, independent
        of the prescaler). Subtracted from the target period before deriving
        the TIMINGR values. Default calibrated on LSQSH EVB.

    scl-gpios:
      type: phandle-array
      description: |
        GPIO to which the I2C SCL signal is routed. This is only needed for I2C bus recovery
        support.

    sda-gpios:
      type: phandle-array
      description: |
        GPIO to which the I2C SDA signal is routed. This is only needed for I2C bus recovery
        support.

    pinctrl-noinit:
      type: boolean
      description: |
        do not run pinctrl during init stage
